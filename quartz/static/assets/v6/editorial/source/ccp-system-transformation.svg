<!--
  Civic Orderism — Tier 1 flagship editorial plate
  《中共正在变成什么？》 · Load Redistribution
  ================================================================
  A system's cross-section. Distributed load (the light field) progressively
  bunches toward the core as two constraint lines close in from either side.
  The outer strands are sheared off part-way and shed to the periphery — the
  load is not removed, it is redistributed outward. One wine datum runs
  unbroken through the whole width: the path continues.

  Read as: distribution of growth -> distribution of loss.

  Discipline
    - exactly one C-device (this load field); no arrows, no nodes, no second
      grid, no legend, no title, no chart furniture
    - B (Editorial Archive) supplies the plate: rules, section marks, folio
      band, registration ticks, generous negative space
    - no personnel, no flags, no maps, no events; this is a system, not a scene

  Geometry (viewBox 0 0 2400 1263, canonical 1.9:1)
    band        y 380..940 at the left, pinched by (1 - 0.70*t^1.15)
    constraint  two heavy polylines closing toward the centre line
    load field  13 strands, outer ones sheared early
    datum       y 660, x 230..2170, unbroken
-->
