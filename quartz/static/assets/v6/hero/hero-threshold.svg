<?xml version="1.0" encoding="UTF-8"?>
<!--
  Civic Orderism — Homepage Hero · CONTINUITY
  ================================================================
  Two structures and one line. The structure on the left is dense and low:
  the order that already stands. The structure on the right is sparser and
  has fewer, further-apart members: the order being prepared. Between them
  is a passage, bounded on each side.

  A single wine datum runs the entire width. It holds its level beneath the
  first structure, rises once across the passage, and continues level beneath
  the second. It is never broken.

  The structure changes. The line does not.

  GEOMETRY (viewBox 0 0 1200 900, 4:3)
    left mass    x  80..530, y 250..590 — dense: six members
    right mass   x 670..1120, y 250..590 — resolved: three members, wider bays
    passage      x 530..670 — bounded by the two wine uprights
    datum        y 590 → 470 across the passage, level either side, x 40..1160
    beams        y 250 and y 590, within each mass, open across the passage

  DISCIPLINE
  One idea, no symbolism. Two line weights (2 secondary, 3 primary) and three
  stroke colours — key, secondary, wine — plus one pale tint for mass. Wine
  appears only as the datum and the two passage uprights, never as a fill.
  No hatch, no tick marks, no grid, no labels, no numerals, no Threshold Mark,
  no political imagery. Every line carries meaning; nothing is decorative.

  THE RATIO
  4:3, not 2:1. At the Hero's 437px display width a 2:1 canvas scales by 0.364
  and a 3-unit line renders at 1.09px, which forces texture — hatch and tick
  marks — to carry weight, and that is what made the earlier artwork read as a
  technical drawing. At 4:3 the same line renders at 1.64px, so the drawing
  itself can carry the mass.

  THEMING
  prefers-color-scheme, so ONE asset serves both themes with no filter, no
  invert and no second file. V6 keeps this in sync with saved-theme via
  custom.scss.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid meet">
  <style>
    .key  { fill:none; stroke:#1b1c1f; stroke-width:3; }
    .str  { fill:none; stroke:#5b6169; stroke-width:2; }
    .wine { fill:none; stroke:#7a2430; stroke-width:3; }
    .tint { fill:#e6e1d9; }
    @media (prefers-color-scheme: dark) {
      .key { stroke:#eceae5; } .str { stroke:#9aa0aa; } .wine { stroke:#d98b96; }
      .tint { fill:#272a30; }
    }
  </style>

  <!-- the order that stands: dense, low -->
  <rect class="tint" x="80" y="250" width="450" height="340"/>
  <path class="str" d="M80 250 V590 M170 250 V590 M260 250 V590 M350 250 V590 M440 250 V590 M530 250 V590"/>

  <!-- the order being prepared: fewer members, wider bays -->
  <rect class="tint" x="670" y="250" width="450" height="340"/>
  <path class="str" d="M670 250 V590 M870 250 V590 M1070 250 V590"/>

  <!-- beam and ground, within each structure; open across the passage -->
  <path class="key" d="M80 250 H530 M670 250 H1120"/>
  <path class="key" d="M80 590 H530 M670 590 H1120"/>

  <!-- the passage: the datum passes through it, not around it -->
  <path class="wine" d="M530 210 V640 M670 210 V640"/>

  <!-- THE DATUM: one line, full width, raised once beyond the crossing -->
  <path class="wine" d="M40 590 H530 L670 470 H1160"/>
</svg>
