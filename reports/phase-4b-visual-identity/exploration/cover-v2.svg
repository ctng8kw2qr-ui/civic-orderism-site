<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1263" width="2400" height="1263">
  <defs>
    <style>
      .paper { fill: #faf8f5; }
      .mass  { fill: #e7e3dc; }
      .massD { fill: #c9c3b9; }
      .str   { fill: none; stroke: #63676f; stroke-width: 3.5; }
      .strD  { fill: none; stroke: #45484f; stroke-width: 5; }
      .bnd   { fill: none; stroke: #1b1c1f; stroke-width: 5; }
      .wine  { fill: none; stroke: #7a2430; stroke-width: 8; }
      .rule  { stroke: #e0dcd5; stroke-width: 2; }
      .ruleS { stroke: #d9c4c7; stroke-width: 2; }
      .thin  { stroke: #c9c3b9; stroke-width: 2; }
    </style>
  </defs>
  <rect class="paper" width="2400" height="1263"/>

  <!-- the enclosing mass that builds from right: constraint -->
  <path class="mass" d="M1560 200 L2280 200 L2280 1063 L1560 1063 Z"/>
  <!-- inner denser band: control -->
  <path class="massD" d="M1560 200 L1780 200 L1780 1063 L1560 1063 Z"/>

  <!-- open left field: dispersed strands -->
  <g class="str">
    <line x1="140" y1="300" x2="1560" y2="300"/>
    <line x1="140" y1="400" x2="1560" y2="400"/>
    <line x1="140" y1="500" x2="1560" y2="500"/>
    <line x1="140" y1="640" x2="1560" y2="640"/>
    <line x1="140" y1="780" x2="1560" y2="780"/>
    <line x1="140" y1="880" x2="1560" y2="880"/>
    <line x1="140" y1="980" x2="1560" y2="980"/>
  </g>

  <!-- the single channel that continues through the mass -->
  <g class="strD">
    <line x1="140" y1="540" x2="2280" y2="540"/>
    <line x1="140" y1="740" x2="2280" y2="740"/>
  </g>

  <!-- the load path -->
  <line class="wine" x1="140" y1="640" x2="2280" y2="640"/>

  <!-- strands terminated, shed to the periphery, falling away -->
  <g class="strD">
    <line x1="1560" y1="300" x2="2000" y2="300"/>
    <line x1="2000" y1="300" x2="2280" y2="430"/>
    <line x1="1560" y1="980" x2="2000" y2="980"/>
    <line x1="2000" y1="980" x2="2280" y2="850"/>
  </g>

  <!-- boundary of the mass -->
  <path class="bnd" d="M1560 200 L2280 200 L2280 1063 L1560 1063 Z"/>

  <!-- plate rules -->
  <line class="rule" x1="140" y1="1163" x2="2280" y2="1163"/>
  <line class="ruleS" x1="1560" y1="120" x2="1560" y2="176"/>
  <line class="thin" x1="140" y1="120" x2="1560" y2="120"/>
</svg>
