<?xml version="1.0" encoding="UTF-8"?>
<!-- Civic Orderism — Homepage Hero · THRESHOLD
     One continuous datum. One boundary standing across it. A gap in that
     boundary. The datum continues through. The structure is not removed;
     the passage is opened. Abstract measured drawing, not a literal wall. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style>
      .band  { fill: #e7e3dc; }
      .line  { fill: none; stroke: #1b1c1f; stroke-width: 3.5; }
      .edge  { stroke: #8b9099; stroke-width: 2; }
      .datum { stroke: #7a2430; stroke-width: 6; }
      .ref   { stroke: #d9c4c7; stroke-width: 2; }
      .tick  { stroke: #c9c3b9; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .band  { fill: #26282e; }
        .line  { stroke: #eceae5; }
        .edge  { stroke: #6f747c; }
        .datum { stroke: #d98b96; }
        .ref   { stroke: #4a4d54; }
        .tick  { stroke: #3a3d43; }
      }
    </style>
  </defs>

  <!-- boundary band, with a gap: the opening -->
  <rect class="band" x="570" y="70" width="60" height="290"/>
  <path class="line" d="M570 70 L630 70 L630 360 L570 360 Z"/>

  <!-- the gap is bounded by a shallow lintel line -->
  <line class="edge" x1="570" y1="360" x2="630" y2="360"/>

  <!-- one datum, running the full width, passing through the gap -->
  <line class="datum" x1="80" y1="470" x2="1120" y2="470"/>

  <!-- the band meets the datum only through the gap: the path -->
  <line class="edge" x1="600" y1="360" x2="600" y2="470"/>

  <!-- measured references -->
  <line class="ref" x1="80" y1="70" x2="1120" y2="70"/>
  <line class="ref" x1="80" y1="54" x2="80" y2="86"/>
  <line class="ref" x1="1120" y1="54" x2="1120" y2="86"/>
  <line class="tick" x1="570" y1="470" x2="570" y2="500"/>
  <line class="tick" x1="630" y1="470" x2="630" y2="500"/>
</svg>
