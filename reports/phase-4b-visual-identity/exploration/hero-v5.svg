<?xml version="1.0" encoding="UTF-8"?>
<!-- Civic Orderism — Homepage Hero · THRESHOLD
     A structural wall with one passage cut through it. A single datum runs
     unbroken from one side to the other: the structure continues, the path
     changes. Measured-drawing register, deliberately not a silhouette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style>
      .mass  { fill: #e7e3dc; }
      .wall  { fill: none; stroke: #1b1c1f; stroke-width: 4; }
      .face  { stroke: #8b9099; stroke-width: 2.5; }
      .datum { stroke: #7a2430; stroke-width: 6; }
      .ref   { stroke: #d9c4c7; stroke-width: 2.5; }
      @media (prefers-color-scheme: dark) {
        .mass  { fill: #26282e; }
        .wall  { stroke: #eceae5; }
        .face  { stroke: #8b9099; }
        .datum { stroke: #d98b96; }
        .ref   { stroke: #4a4d54; }
      }
    </style>
  </defs>

  <!-- wall body, passage cut through; segmental arch so it reads institutional -->
  <path class="mass" d="M430 60 L770 60 L770 528 L672 528 L672 232 A110 110 0 0 1 528 232 L528 528 L430 528 Z"/>
  <path class="wall" d="M430 60 L770 60 L770 528 L672 528 L672 232 A110 110 0 0 1 528 232 L528 528 L430 528 Z"/>

  <!-- wall faces -->
  <line class="face" x1="430" y1="60" x2="430" y2="528"/>
  <line class="face" x1="770" y1="60" x2="770" y2="528"/>
  <!-- passage reveals: the depth of the wall -->
  <path class="face" d="M528 232 A110 110 0 0 1 672 232"/>
  <line class="face" x1="528" y1="232" x2="528" y2="528"/>
  <line class="face" x1="672" y1="232" x2="672" y2="528"/>

  <!-- one unbroken datum: the path continues -->
  <line class="datum" x1="80" y1="528" x2="1120" y2="528"/>

  <!-- measured references -->
  <line class="ref" x1="80"   y1="60" x2="1120" y2="60"/>
  <line class="ref" x1="80"   y1="44" x2="80"   y2="76"/>
  <line class="ref" x1="1120" y1="44" x2="1120" y2="76"/>
</svg>
