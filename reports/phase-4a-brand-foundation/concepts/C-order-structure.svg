<?xml version="1.0" encoding="UTF-8"?>
<!-- CONCEPT C — Order / Structure Mark
     Inherits: columns + symmetry + boundary from the legacy mark.
     Abstraction: a centred structural frame inside the circle — chambers + a threshold slot.
     ELEMENTS: 1 circle, 1 frame, 1 threshold slot = 3 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="butt">
    <circle cx="50" cy="50" r="44"/>
    <rect x="29" y="29" width="42" height="42"/>
    <line x1="29" y1="50" x2="71" y2="50"/>
  </g>
</svg>
