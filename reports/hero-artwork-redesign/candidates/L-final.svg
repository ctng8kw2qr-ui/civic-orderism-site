<?xml version="1.0" encoding="UTF-8"?>
<!--
  Civic Orderism — Homepage Hero · THRESHOLD, IN SECTION
  ================================================================
  A long structural mass seen in SECTION. There is no facade, no arch and no
  door: the mass simply stops, leaving a registered opening, and resumes beyond
  it. A single datum runs the full width at the base and continues straight
  through that opening. The structure is not removed — a crossing is opened.

  Structure continues. The path changes.

  GEOMETRY (viewBox 0 0 1200 600)
    mass        x 40..1160, y 130..430
    upper core  y 130..246 — the system carries its weight at the top
    opening     x 505..695, full height of the mass: a gap, not a doorway
    datum       y 430, x 0..1200 — wider than the mass, unbroken
    crossing    continues past the mass, registered but unlabelled

  DISCIPLINE
    One idea, no symbolism. Line hierarchy is primary / secondary / hairline /
    wine datum / registration, five distinct weights. Wine appears only as the
    datum and the two edge registers — never as a fill. No labels, no numerals,
    no Threshold Mark, no political imagery.

  THEMING
    prefers-color-scheme, so ONE asset serves both themes with no filter, no
    invert and no second file. Every surface that must match the page (the
    opening, the tick gaps) is painted from a theme token, never a hardcoded
    paper colour that would be wrong in the other theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="hx" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hatch" x1="0" y1="0" x2="0" y2="10" stroke-width="1.7"/>
    </pattern>
    <style>
      .mass  { fill: #e6e1d9; }
      .core  { fill: #d5cfc5; }
      .paper { fill: #faf8f5; }
      .hatch { stroke: #cbc5bb; }
      .key   { fill: none; stroke: #1b1c1f; stroke-width: 3.2; }
      .str   { fill: none; stroke: #5b6169; stroke-width: 2; }
      .hair  { fill: none; stroke: #c9c3b9; stroke-width: 1.3; }
      .wine  { fill: none; stroke: #7a2430; stroke-width: 5.5; }
      .reg   { fill: none; stroke: #d9c4c7; stroke-width: 2; }
      .mark  { fill: none; stroke: #b3ada3; stroke-width: 1.4; }
      @media (prefers-color-scheme: dark) {
        .mass  { fill: #272a30; }
        .core  { fill: #33373f; }
        .paper { fill: #141518; }
        .hatch { stroke: #3f434a; }
        .key   { stroke: #eceae5; }
        .str   { stroke: #9aa0aa; }
        .hair  { stroke: #3a3d43; }
        .wine  { stroke: #d98b96; }
        .reg   { stroke: #5b4a4d; }
        .mark  { stroke: #4a4d54; }
      }
    </style>
  </defs>

  <!-- the structural mass, hatched as a cut surface -->
  <rect class="mass" x="40" y="130" width="1120" height="300"/>
  <rect class="hatch" fill="url(#hx)" stroke="none" x="40" y="130" width="1120" height="300"/>
  <!-- upper core -->
  <rect class="core" x="40" y="130" width="1120" height="116"/>
  <rect class="hatch" fill="url(#hx)" stroke="none" x="40" y="130" width="1120" height="116"/>

  <!-- the opening: a registered gap through the full height of the mass -->
  <rect class="paper" x="505" y="130" width="190" height="300"/>

  <!-- mass profile -->
  <path class="key" d="M40 130 L1160 130 M40 430 L1160 430 M40 130 L40 430 M1160 130 L1160 430"/>
  <!-- the two structural edges of the opening -->
  <path class="key" d="M505 130 L505 430 M695 130 L695 430"/>
  <!-- strata, interrupted by the opening -->
  <path class="str"  d="M40 246 L505 246 M695 246 L1160 246"/>
  <path class="hair" d="M40 348 L505 348 M695 348 L1160 348"/>

  <!-- the continuity datum: unbroken, wider than the mass -->
  <line class="wine" x1="0" y1="430" x2="1200" y2="430"/>

  <!-- the crossing continues beyond the mass -->
  <path class="hair" d="M505 430 L505 486 M695 430 L695 486"/>
  <path class="wine" d="M568 430 L568 470 M632 430 L632 470"/>

  <!-- measured registration above the mass: sparse, unlabelled -->
  <path class="hair" d="M40 96 L1160 96"/>
  <path class="mark" d="M505 74 L505 118 M600 74 L600 118 M695 74 L695 118"/>
  <path class="mark" d="M250 74 L250 108 M950 74 L950 108"/>
</svg>
