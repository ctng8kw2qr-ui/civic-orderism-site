<?xml version="1.0" encoding="UTF-8"?>
<!-- CANDIDATE B — CONTINUOUS PASSAGE -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs><style>
    .dense { fill: none; stroke: #63676f; stroke-width: 2; }
    .key   { fill: none; stroke: #1b1c1f; stroke-width: 3.4; }
    .hair  { fill: none; stroke: #c9c3b9; stroke-width: 1.4; }
    .wine  { fill: none; stroke: #7a2430; stroke-width: 6; }
    .reg   { fill: none; stroke: #d9c4c7; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .dense { stroke: #8b9099; } .key { stroke: #eceae5; }
      .hair { stroke: #3a3d43; } .wine { stroke: #d98b96; } .reg { stroke: #5b4a4d; }
    }
  </style></defs>

  <!-- left: denser structure -->
  <g class="dense">
    <line x1="60" y1="150" x2="470" y2="150"/>
    <line x1="60" y1="190" x2="470" y2="190"/>
    <line x1="60" y1="230" x2="470" y2="230"/>
    <line x1="60" y1="350" x2="470" y2="350"/>
    <line x1="60" y1="390" x2="470" y2="390"/>
    <line x1="60" y1="430" x2="470" y2="430"/>
  </g>
  <g class="key"><line x1="60" y1="270" x2="470" y2="270"/><line x1="60" y1="310" x2="470" y2="310"/></g>

  <!-- the passage: structure opens -->
  <path class="key" d="M470 150 L470 270 M470 310 L470 430"/>
  <path class="key" d="M470 150 L620 150 M470 430 L620 430"/>

  <!-- right: re-expanded, but changed alignment -->
  <g class="dense">
    <line x1="620" y1="196" x2="1140" y2="196"/>
    <line x1="620" y1="246" x2="1140" y2="246"/>
    <line x1="620" y1="334" x2="1140" y2="334"/>
    <line x1="620" y1="384" x2="1140" y2="384"/>
  </g>
  <g class="key"><line x1="620" y1="290" x2="1140" y2="290"/></g>

  <!-- continuity datum, unbroken -->
  <line class="wine" x1="40" y1="290" x2="1160" y2="290"/>

  <!-- registration + measured detail -->
  <line class="reg" x1="40" y1="110" x2="1160" y2="110"/>
  <line class="reg" x1="40" y1="470" x2="1160" y2="470"/>
  <g class="hair">
    <line x1="470" y1="90" x2="470" y2="126"/>
    <line x1="620" y1="90" x2="620" y2="126"/>
    <line x1="545" y1="500" x2="545" y2="536"/>
  </g>
</svg>
