<?xml version="1.0" encoding="UTF-8"?>
<!--
  Civic Orderism — Homepage Hero · INSTITUTIONAL TRANSITION FIELD
  ================================================================
  A field of structural lines crosses the frame. Two of them are interrupted;
  the rest continue. The interruptions are registered, and the field re-forms
  on the far side of them, offset. One continuity datum runs the full width
  without a break.

  Structure continues. The path changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid meet">
  <defs><style>
    .plane { fill: #f3f0eb; opacity: 0; }
    .str   { fill: none; stroke: #5b6169; stroke-width: 2.2; }
    .key   { fill: none; stroke: #1b1c1f; stroke-width: 3.6; }
    .hair  { fill: none; stroke: #c9c3b9; stroke-width: 1.3; }
    .wine  { fill: none; stroke: #7a2430; stroke-width: 5.5; }
    .reg   { fill: none; stroke: #d9c4c7; stroke-width: 2; }
    .mark  { fill: none; stroke: #b9b3a9; stroke-width: 1.3; }
    @media (prefers-color-scheme: dark) {
      .plane { fill: #23252a; opacity: 1; }
      .str   { stroke: #9aa0aa; }
      .key   { stroke: #eceae5; }
      .hair  { stroke: #3a3d43; }
      .wine  { stroke: #d98b96; }
      .reg   { stroke: #5b4a4d; }
      .mark  { stroke: #4a4d54; }
    }
  </style></defs>

  <rect class="plane" x="20" y="60" width="1160" height="480"/>

  <!-- measured registration frame: the plate -->
  <path class="hair" d="M20 60 L1180 60 M20 540 L1180 540 M20 60 L20 540 M1180 60 L1180 540"/>

  <!-- the field. eight lines; two are interrupted, six continue -->
  <line class="str" x1="20" y1="128" x2="1180" y2="128"/>
  <line class="key" x1="20" y1="182" x2="1180" y2="182"/>
  <line class="str" x1="20" y1="236" x2="1180" y2="236"/>

  <!-- interrupted pair: stops, then re-forms offset -->
  <line class="str" x1="20" y1="300" x2="486" y2="300"/>
  <line class="str" x1="676" y1="322" x2="1180" y2="322"/>

  <!-- the continuous core lines -->
  <line class="hair" x1="20" y1="360" x2="1180" y2="360"/>
  <line class="key" x1="20" y1="418" x2="1180" y2="418"/>
  <line class="str" x1="20" y1="472" x2="1180" y2="472"/>

  <!-- structural interruption: registered at both ends -->
  <path class="reg" d="M486 268 L486 340 M676 268 L676 340"/>
  <path class="mark" d="M486 282 L512 282 M650 340 L676 340"/>

  <!-- continuity datum, unbroken -->
  <line class="wine" x1="0" y1="396" x2="1200" y2="396"/>

  <!-- measured marks: section + alignment, kept sparse -->
  <path class="mark" d="M310 34 L310 60 M700 34 L700 60 M1010 34 L1010 60"/>
  <path class="mark" d="M310 540 L310 566 M700 540 L700 566 M1010 540 L1010 566"/>
</svg>
